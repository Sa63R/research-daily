<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保研与科研日报</title>
  <meta name="description" content="每日整理保研信息、科研方法与值得学习的课程资源。">
  <meta property="og:title" content="保研与科研日报"><meta property="og:description" content="保研信息、科研方法与学习资源。"><meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a7f37'/%3E%3Cpath d='M8 7h16v18H8z' fill='white'/%3E%3Cpath d='M11 12h10M11 16h10M11 20h6' stroke='%231a7f37' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=20260916">
  <script defer src="./vendor/marked.min.js"></script><script defer src="./vendor/purify.min.js"></script>
  <script src="./config.js?v=20260916"></script><script defer src="./app.js?v=20260916-structure"></script>
</head>
<body>
<div class="site-shell">
  <header class="hero">
    <a class="hero-copy hero-home-link" id="home-link" href="./"><h1>保研与科研日报</h1><p class="hero-summary">保研信息 · 科研方法 · 学习资源</p></a>
    <div class="hero-status">
      <a href="https://github.com/Sa63R/research-daily" target="_blank" rel="noopener noreferrer" class="status-chip">GitHub</a>
      <span class="status-chip" id="report-count">0 篇日报</span>
      <button class="status-chip" id="search-btn" type="button" aria-label="搜索所有日报">搜索</button>
      <button class="status-chip" id="theme-toggle" type="button" aria-label="切换阅读模式"><span class="icon-sun">浅色</span><span class="icon-moon">深色</span><span class="icon-system">跟随系统</span></button>
    </div>
  </header>
  <main>
    <section class="reader-view" id="reader-view">
      <section class="reader-intro">
        <section class="date-switcher" id="date-switcher" aria-label="日期切换">
          <div class="date-switcher-bar">
            <button class="date-nav-btn" id="prev-date-btn" type="button" aria-label="上一期">‹</button>
            <button class="date-current-btn" id="current-date-btn" type="button" aria-controls="date-switcher-popover" aria-expanded="false"><span class="date-current-value" id="date-switcher-current">正在读取日期</span><span aria-hidden="true">⌄</span></button>
            <button class="date-nav-btn" id="next-date-btn" type="button" aria-label="下一期">›</button>
          </div>
          <div class="date-switcher-popover" id="date-switcher-popover" hidden>
            <div class="date-switcher-popover-head"><p class="date-switcher-title">选择日报日期</p></div><div class="date-switcher-list" id="date-switcher-list"></div>
          </div>
        </section>
      </section>
      <section class="report-card" aria-live="polite">
        <div class="loading-state" id="loading-state"><div class="loading-line wide"></div><div class="loading-line"></div><div class="loading-line narrow"></div></div>
        <article class="report-content" id="report-content"></article>
      </section>
    </section>
  </main>
  <footer class="site-footer"><p class="disclaimer-note">AI 整理，仅供参考。招生信息以官方通知为准。</p><a href="https://github.com/jielosc/csbaoyan-chat-daily" target="_blank" rel="noopener noreferrer">基于绿群日报</a></footer>
</div>
<div class="search-modal" id="search-modal" aria-hidden="true" hidden>
  <div class="search-backdrop" id="search-backdrop"></div>
  <div class="search-container" role="dialog" aria-modal="true" aria-label="搜索日报">
    <div class="search-header"><input type="search" id="search-input" class="search-input" placeholder="搜索院校、课程或研究方向" aria-label="搜索所有日报" autocomplete="off"><button class="close-search-btn" id="close-search-btn" type="button" aria-label="关闭搜索">×</button></div>
    <div class="search-results" id="search-results"><div class="search-placeholder">输入关键词开始搜索</div></div>
  </div>
</div>
</body>
</html>
